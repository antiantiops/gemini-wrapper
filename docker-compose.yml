version: '3.8'

services:
  gemini-wrapper:
    # Use pre-built image from Docker Hub
    image: antiantiops/gemini-wrapper:latest
    container_name: gemini-wrapper
    ports:
      - "8080:8080"
    environment:
      # Let agy edit the real VSCode/project workspace instead of /app.
      # Change this to the project path mounted below.
      - ANTIGRAVITY_WORKDIR=/workspace
      # Optional but recommended for VSCode/headless usage; otherwise agy may
      # wait for interactive permission prompts that the API caller cannot answer.
      - ANTIGRAVITY_SKIP_PERMISSIONS=true
    volumes:
      # Mount .gemini credentials folder from host to container (read-write for token renewal)
      # Make sure to run 'gemini' on host first to authenticate
      # Linux/Mac: uses ${HOME}
      - ${HOME}/.gemini:/app/.gemini
      # Windows: use ${USERPROFILE} instead
      # - ${USERPROFILE}/.gemini:/app/.gemini
      # Mount the project opened in VSCode so agy can read/write the real files.
      # Set PROJECT_DIR when starting compose, e.g. PROJECT_DIR=$PWD docker compose up -d
      - ${PROJECT_DIR:-.}:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--method=GET", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
